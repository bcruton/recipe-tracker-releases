<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Progress report</title>
<style>
  :root {
    --fig: #3B423B;
    --green: #2E7D32; --green-2: #1B5E20; --tint: #E8F3E8; --bg: #F5F7F4; --card: #FFFFFF;
    --text: #1B1F1B; --muted: #5A635A; --line: #DDE3DB; --up: #2E7D32; --down: #C62828; --accent: #F9A825;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fig: #C9D1C7; --bg: #111511; --card: #1C221C; --text: #E8EDE6; --muted: #A3ADA1; --line: #2E372D; --tint: #213021; --up: #81C784; --down: #EF9A9A; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--green); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 18px 16px; }
  header .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; opacity: .9; }
  header h1 { margin: 8px 0 2px; font-size: 24px; line-height: 1.2; }
  header p { margin: 0; opacity: .9; font-size: 14px; }
  nav { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav button { flex: 1; min-height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--tint); color: var(--green); }
  @media (prefers-color-scheme: dark) { nav button[aria-selected="true"] { color: #A5D6A7; } }
  main { padding: 14px 14px 40px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 4px 10px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--card); border-radius: 16px; overflow: hidden; }
  .item > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 56px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .item .name { flex: 1; min-width: 0; }
  .item .name b { display: block; font-weight: 600; }
  .item .name small { color: var(--muted); font-size: 13px; }
  .badge { font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
  .badge.up { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); }
  .badge.down { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  .badge.flat { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
  .detail { display: none; padding: 0 14px 14px; }
  .item.open .detail { display: block; }
  .chev { color: var(--muted); transition: transform .2s; }
  .item.open .chev { transform: rotate(90deg); }
  .range { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .grid .item.open { grid-column: 1 / -1; }
  .grid .item > button { flex-direction: column; align-items: flex-start; gap: 2px; }
  .big { font-size: 22px; font-weight: 700; }
  .rows { margin: 0; padding: 0; list-style: none; }
  .rows li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .rows li span:last-child { color: var(--muted); text-align: right; }
  .skip { opacity: .55; text-decoration: line-through; }
  .empty, .msg { color: var(--muted); padding: 24px 6px; text-align: center; }
  svg { display: block; width: 100%; height: auto; }
  .figwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr); gap: 8px; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .figure { width: 100%; height: 100%; max-height: 520px; color: color-mix(in srgb, var(--text) 70%, transparent); }
  .mcard { flex: 1; min-height: 58px; border: 0; border-radius: 12px; background: var(--card); color: inherit; font: inherit; padding: 6px 4px;
           display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; text-align: center; }
  .mcard b { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .mcard span { font-size: 15px; }
  .mcard small { font-size: 11px; font-weight: 700; }
  .mcard small.up { color: var(--up); } .mcard small.down { color: var(--down); } .mcard small.flat { color: var(--muted); }
  .mcard[disabled] { opacity: .45; cursor: default; }
  .extras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 5; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-radius: 22px 22px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
           max-width: 640px; margin: 0 auto; transform: translateY(105%); transition: transform .22s ease; }
  .sheet.open { transform: none; } .sheet-bg.open { display: block; }
  .sheet h3 { margin: 0 0 2px; font-size: 20px; }
  .sheet .close { float: right; border: 0; background: var(--tint); color: inherit; border-radius: 18px; min-height: 40px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0 30px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 108 108" aria-hidden="true" style="width:28px"><rect width="108" height="108" rx="24" fill="#fff" opacity=".18"/><g transform="translate(54 55) scale(.8) translate(-54 -55)"><path fill="#fff" d="M35,22 h40 a7,7 0 0 1 7,7 v52 a7,7 0 0 1 -7,7 h-40 a7,7 0 0 1 -7,-7 v-52 a7,7 0 0 1 7,-7z"/><path fill="#C8E6C9" d="M33,22 h5 v66 h-5 a5,5 0 0 1 -5,-5 v-56 a5,5 0 0 1 5,-5z"/><path fill="#F9A825" d="M68,22 h8 v18 l-4,-3 l-4,3 z"/><circle cx="60" cy="56" r="17" fill="#2E7D32"/></g></svg>
    Recipe Tracker · progress report
  </div>
  <h1 id="title">Loading…</h1>
  <p id="period"></p>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="main"><div class="msg">Loading the report…</div></main>
<footer>Shared from the Recipe Tracker app.</footer>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
<script>
(function () {
  var PROJECT = "recipe-tracker-24899";
  var KEY = "AIzaSyAO64cF9HhYeYhK5De_xn2j7dj7zqtEBwM";
  var id = (location.hash || "").replace("#", "").replace(/[^A-Za-z0-9]/g, "");
  var main = document.getElementById("main");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function d(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function md(s) { var x = d(s); return MONTHS[x.getMonth()] + " " + x.getDate(); }
  function wmd(s) { var x = d(s); return DAYS[x.getDay()] + ", " + MONTHS[x.getMonth()] + " " + x.getDate(); }
  function num2(v) { return (Math.round(v * 100) / 100).toString(); }
  function num(v) { return Math.abs(v % 1) < 0.005 ? String(Math.round(v)) : (Math.round(v * 10) / 10).toString(); }

  function badge(points, unit, lowerIsBetter) {
    if (!points || points.length < 2) return '<span class="badge flat">' + (points && points.length ? num(points[points.length - 1].value) + " " + esc(unit) : "–") + "</span>";
    var diff = points[points.length - 1].value - points[0].value;
    if (Math.abs(diff) < 0.01) return '<span class="badge flat">no change</span>';
    var good = lowerIsBetter ? diff < 0 : diff > 0;
    return '<span class="badge ' + (good ? "up" : "down") + '">' + (diff > 0 ? "+" : "−") + num(Math.abs(diff)) + " " + esc(unit) + "</span>";
  }

  function chart(points, unit) {
    if (!points.length) return "";
    var W = 340, H = 170, L = 38, R = 10, T = 12, B = 26;
    var vals = points.map(function (p) { return p.value; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = Math.max((hi - lo) * 0.15, 0.5); lo -= pad; hi += pad;
    var t0 = d(points[0].date).getTime(), t1 = d(points[points.length - 1].date).getTime(); if (t1 === t0) t1 = t0 + 864e5;
    function x(p) { return points.length === 1 ? (L + W - R) / 2 : L + (d(p.date).getTime() - t0) / (t1 - t0) * (W - L - R); }
    function y(v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); }
    var g = "";
    for (var i = 0; i <= 3; i++) {
      var v = lo + (hi - lo) * i / 3, yy = y(v);
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)"/>' +
           '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + num(v) + "</text>";
    }
    var path = points.map(function (p, i) { return (i ? "L" : "M") + x(p).toFixed(1) + " " + y(p.value).toFixed(1); }).join(" ");
    var dots = points.map(function (p) { return '<circle cx="' + x(p) + '" cy="' + y(p.value) + '" r="4.5" fill="var(--green)"><title>' + md(p.date) + ": " + num(p.value) + " " + esc(unit) + "</title></circle>"; }).join("");
    var labels = '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="var(--muted)">' + md(points[0].date) + "</text>" +
      (points.length > 1 ? '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + md(points[points.length - 1].date) + "</text>" : "");
    var line = points.length > 1 ? '<path d="' + path + '" fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>' : "";
    return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Chart">' + g + line + dots + labels + "</svg>";
  }

  function lowHigh(points, unit) {
    if (!points.length) return "";
    var lo = points[0], hi = points[0];
    points.forEach(function (p) { if (p.value < lo.value) lo = p; if (p.value > hi.value) hi = p; });
    return '<div class="range"><span>Lowest ' + num(lo.value) + " " + esc(unit) + " (" + md(lo.date) + ')</span><span>Highest ' + num(hi.value) + " " + esc(unit) + " (" + md(hi.date) + ")</span></div>";
  }

  function toggle(el) { el.closest(".item").classList.toggle("open"); var b = el; b.setAttribute("aria-expanded", b.closest(".item").classList.contains("open")); }

  function workoutsTab(w, from, to) {
    var s = w.sessions || [], ex = w.exercises || [];
    var weeks = Math.max(1, (d(to) - d(from)) / 864e5 / 7);
    var mins = s.reduce(function (a, x) { return a + (x.minutes || 0); }, 0);
    var h = '<div class="stats"><div class="stat"><b>' + s.length + '</b><span>workouts</span></div>' +
      '<div class="stat"><b>' + (Math.round(s.length / weeks * 10) / 10) + '</b><span>per week</span></div>' +
      '<div class="stat"><b>' + Math.round(mins / Math.max(1, s.length)) + '</b><span>avg min</span></div></div>';
    h += "<h2>Exercises</h2>";
    if (!ex.length) h += '<div class="empty">No exercises logged in this period.</div>';
    h += '<div class="list">' + ex.map(function (e) {
      var pts = e.points || [], last = pts.length ? num(pts[pts.length - 1].value) + " " + esc(e.unit || "") : "no weight";
      return '<div class="item"><button aria-expanded="false" data-t><span class="name"><b>' + esc(e.name) + "</b><small>" + last +
        (e.lastReps ? " × " + esc(e.lastReps) : "") + " · done " + e.times + "×</small></span>" + badge(pts, e.unit || "") + '<span class="chev">›</span></button>' +
        '<div class="detail">' + (pts.length ? chart(pts, e.unit || "") + lowHigh(pts, e.unit || "") : '<div class="empty">No weights recorded.</div>') + "</div></div>";
    }).join("") + "</div>";
    h += "<h2>Sessions</h2>";
    if (!s.length) h += '<div class="empty">No workouts in this period.</div>';
    h += '<div class="list">' + s.slice().reverse().map(function (x) {
      var done = (x.exercises || []).filter(function (e) { return e.done; }).length;
      return '<div class="item"><button aria-expanded="false" data-t><span class="name"><b>' + esc(x.name) + "</b><small>" + wmd(x.date) + " · " + x.minutes + " min · " + done + "/" + (x.exercises || []).length + ' exercises</small></span><span class="chev">›</span></button>' +
        '<div class="detail"><ul class="rows">' + (x.exercises || []).map(function (e) {
          var plan = [e.sets && e.reps ? e.sets + " × " + e.reps : (e.reps || ""), e.weight].filter(Boolean).join(" · ");
          return '<li class="' + (e.done ? "" : "skip") + '"><span>' + esc(e.name) + "</span><span>" + esc(plan || (e.done ? "done" : "skipped")) + "</span></li>";
        }).join("") + "</ul></div></div>";
    }).join("") + "</div>";
    return h;
  }

  var LOWER = { weight: 1, bodyFat: 1, waist: 1, hips: 1, highHip: 1 };
  var LEFT = ["neck", "shoulders", "leftBiceps", "leftForearm", "waist", "leftThigh", "leftCalf"];
  var RIGHT = ["weight", "chest", "rightBiceps", "rightForearm", "hips", "rightThigh", "rightCalf"];
  var EXTRA = ["bodyFat", "muscle", "highHip"];
  var NAMES = { neck: "Neck", shoulders: "Shoulders", leftBiceps: "Left biceps", rightBiceps: "Right biceps", leftForearm: "Left forearm",
    rightForearm: "Right forearm", waist: "Waist", hips: "Hips", leftThigh: "Left thigh", rightThigh: "Right thigh", leftCalf: "Left calf",
    rightCalf: "Right calf", weight: "Weight", chest: "Chest", bodyFat: "Body fat", muscle: "Muscle ratio", highHip: "High hip" };
  var FIGURE = '<svg class="figure" viewBox="0 0 100 250" aria-hidden="true">       <path d="M55 27 C55.5 30 56 33 56 35 C62 38 70 38 75 41 C81 43 83.5 50 83 58 C84 70 86 80 87 92 C88 104 90 114 90 122 C91 128 89.5 134 86.5 134 C83.5 134 83 128 84 122 C83 112 80 100 78.5 92 C76.5 80 74 68 72.5 60 C71.5 72 68 86 68 98 C68 106 71 112 71.5 118 C72.5 140 70.5 160 68.5 175 C70.5 188 69 205 66.5 222 C66 230 70.5 236 70 240 C66 241.5 61 241.5 57 240.5 C56 236 57 230 58 222 C58 205 57 190 58 175 C57 160 54 140 52 128 C51.5 127.5 50.5 127 50 127 C49.5 127 48.5 127.5 48 128 C46 140 43 160 42 175 C43 190 42 205 42 222 C43 230 44 236 43 240.5 C39 241.5 34 241.5 30 240 C29.5 236 34 230 33.5 222 C31 205 29.5 188 31.5 175 C29.5 160 27.5 140 28.5 118 C29 112 32 106 32 98 C32 86 28.5 72 27.5 60 C26 68 23.5 80 21.5 92 C20 100 17 112 16 122 C17 128 16.5 134 13.5 134 C10.5 134 9 128 10 122 C10 114 12 104 13 92 C14 80 16 70 17 58 C16.5 50 19 43 25 41 C30 38 38 38 44 35 C44 33 44.5 30 45 27 Z" fill="var(--card)" stroke="var(--fig)" stroke-width="1.6" stroke-linejoin="round"/>       <path d="M31.2 106 L68.8 106 C70.8 112 71.6 120 72.2 140 L53.8 141 L50 129 L46.2 141 L27.8 140 C28.4 120 29.2 112 31.2 106 Z" fill="var(--fig)" opacity=".85"/>       <g fill="none" stroke="var(--line)" stroke-width="1.1" stroke-linecap="round">         <path d="M51.5 62 Q60 66 69 58"/><path d="M48.5 62 Q40 66 31 58"/><path d="M50 50 L50 98"/>         <path d="M57.5 172 Q63 176 67.5 172"/><path d="M42.5 172 Q37 176 32.5 172"/>       </g>       <circle cx="50" cy="101" r=".9" fill="var(--line)"/>       <ellipse cx="50" cy="15.5" rx="10.5" ry="13" fill="var(--card)" stroke="var(--fig)" stroke-width="1.6"/>       <ellipse cx="38.9" cy="15.5" rx="1.3" ry="2.5" fill="none" stroke="var(--fig)" stroke-width="1.1"/>       <ellipse cx="61.1" cy="15.5" rx="1.3" ry="2.5" fill="none" stroke="var(--fig)" stroke-width="1.1"/>     </svg>';
  var byKey = {};

  function mcard(k) {
    var m = byKey[k], label = esc(m ? m.label : NAMES[k]);
    if (!m || !m.points.length) return '<button class="mcard" disabled><b>' + label + "</b><span>–</span></button>";
    var pts = m.points, last = pts[pts.length - 1], mark = "";
    if (pts.length > 1) {
      var diff = last.value - pts[0].value;
      if (Math.abs(diff) >= 0.01) {
        var good = LOWER[k] ? diff < 0 : diff > 0;
        mark = '<small class="' + (good ? "up" : "down") + '">' + (diff > 0 ? "▲ " : "▼ ") + num2(Math.abs(diff)) + "</small>";
      } else mark = '<small class="flat">no change</small>';
    }
    return '<button class="mcard" data-m="' + k + '"><b>' + label + "</b><span>" + num2(last.value) + " " + esc(m.unit) + "</span>" + mark + "</button>";
  }

  function bodyTab(b) {
    byKey = {};
    b.forEach(function (m) { byKey[m.key] = m; });
    if (!b.length) return '<div class="empty">No measurements in this period.</div>';
    return '<p class="empty" style="padding:4px 0 10px">Tap a measurement to see its chart.</p>' +
      '<div class="figwrap"><div class="col">' + LEFT.map(mcard).join("") + "</div>" + FIGURE +
      '<div class="col">' + RIGHT.map(mcard).join("") + '</div></div><div class="extras">' + EXTRA.map(mcard).join("") + "</div>";
  }

  function openSheet(k) {
    var m = byKey[k]; if (!m) return;
    var pts = m.points, last = pts[pts.length - 1];
    document.getElementById("sheet-body").innerHTML =
      '<button class="close" id="sheet-close">Close</button><h3>' + esc(m.label) + '</h3><p style="margin:0 0 10px;color:var(--muted)">Latest ' +
      num2(last.value) + " " + esc(m.unit) + " · " + md(last.date) + " " + badge(pts, m.unit, !!LOWER[k]) + "</p>" + chart(pts, m.unit) + lowHigh(pts, m.unit);
    document.getElementById("sheet").classList.add("open");
    document.getElementById("sheet-bg").classList.add("open");
  }
  function closeSheet() {
    document.getElementById("sheet").classList.remove("open");
    document.getElementById("sheet-bg").classList.remove("open");
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-m]"); if (b) openSheet(b.dataset.m);
    if (e.target.id === "sheet-close" || e.target.id === "sheet-bg") closeSheet();
  });

  function clock(t) { var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s2 = t % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s2).padStart(2, "0"); }
  function runsTab(rs) {
    var list = rs.list || [], u = rs.unit || "km";
    if (!list.length) return '<div class="empty">No runs in this period.</div>';
    var total = list.reduce(function (a, x) { return a + x.distance; }, 0);
    var longest = list.reduce(function (a, x) { return x.distance > a.distance ? x : a; }, list[0]);
    var outdoor = list.filter(function (x) { return !x.treadmill && x.distance > 0.05; });
    var paces = outdoor.map(function (x) { return { date: x.date, value: Math.round(x.seconds / x.distance / 60 * 100) / 100 }; });
    var best = outdoor.reduce(function (a, x) { return !a || x.seconds / x.distance < a.seconds / a.distance ? x : a; }, null);
    var h = '<div class="stats"><div class="stat"><b>' + list.length + '</b><span>runs</span></div>' +
      '<div class="stat"><b>' + num(total) + '</b><span>' + u + ' total</span></div>' +
      '<div class="stat"><b>' + num(longest.distance) + '</b><span>' + u + ' longest</span></div></div>';
    // distance per week
    var weeks = {}; list.forEach(function (x) { var dd = d(x.date); var day = (dd.getDay() + 6) % 7; dd.setDate(dd.getDate() - day);
      var k = dd.getFullYear() + "-" + String(dd.getMonth() + 1).padStart(2, "0") + "-" + String(dd.getDate()).padStart(2, "0"); weeks[k] = (weeks[k] || 0) + x.distance; });
    var wk = Object.keys(weeks).sort().map(function (k) { return { date: k, value: Math.round(weeks[k] * 10) / 10 }; });
    h += '<h2>Distance per week (' + u + ')</h2><div class="item" style="padding:12px">' + chart(wk, u) + "</div>";
    if (paces.length > 1) {
      h += '<h2>Pace (min/' + u + ', lower is faster)</h2><div class="item" style="padding:12px">' + chart(paces, "min") +
        (best ? '<div class="range"><span>Fastest ' + clock(Math.round(best.seconds / best.distance)) + " /" + u + " (" + md(best.date) + ")</span></div>" : "") + "</div>";
    }
    h += '<h2>All runs</h2><div class="list">' + list.slice().reverse().map(function (x) {
      var pace = x.distance > 0.05 ? clock(Math.round(x.seconds / x.distance)) + " /" + u : "–";
      return '<div class="item"><button><span class="name"><b>' + esc(x.title || (x.treadmill ? "Treadmill run" : "Run")) + "</b><small>" + wmd(x.date) + " · " + clock(x.seconds) + " · " + pace +
        (x.avgHr ? " · " + Math.round(x.avgHr) + " bpm" : "") + '</small></span><span class="badge flat">' + num(x.distance) + " " + u + "</span></button></div>";
    }).join("") + "</div>";
    return h;
  }

  function render(r) {
    document.getElementById("title").textContent = (r.name ? r.name + "’s progress" : "Progress");
    document.getElementById("period").textContent = md(r.from) + " – " + md(r.to) + ", " + d(r.to).getFullYear();
    document.title = document.getElementById("title").textContent;
    var tabs = [];
    if (r.workouts) tabs.push(["Workouts", function () { return workoutsTab(r.workouts, r.from, r.to); }]);
    if (r.runs) tabs.push(["Runs", function () { return runsTab(r.runs); }]);
    if (r.body) tabs.push(["Body", function () { return bodyTab(r.body); }]);
    var nav = document.getElementById("tabs");
    if (tabs.length < 2) nav.style.display = "none";
    function show(i) {
      nav.innerHTML = tabs.map(function (t, j) { return '<button role="tab" aria-selected="' + (i === j) + '" data-i="' + j + '">' + t[0] + "</button>"; }).join("");
      main.innerHTML = tabs.length ? tabs[i][1]() : '<div class="empty">This report is empty.</div>';
      window.scrollTo(0, 0);
    }
    nav.addEventListener("click", function (e) { var b = e.target.closest("button[data-i]"); if (b) show(+b.dataset.i); });
    main.addEventListener("click", function (e) { var b = e.target.closest("button[data-t]"); if (b) toggle(b); });
    show(0);
  }

  if (!id) { main.innerHTML = '<div class="msg">This link is missing its report code.</div>'; document.getElementById("title").textContent = "Progress report"; return; }
  fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents/reports/" + id + "?key=" + KEY)
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (doc) { render(JSON.parse(doc.fields.json.stringValue)); })
    .catch(function () {
      document.getElementById("title").textContent = "Progress report";
      main.innerHTML = '<div class="msg">This report couldn’t be opened. It may have been removed, or the link is incomplete.</div>';
    });
})();
</script>
</body>
</html>
